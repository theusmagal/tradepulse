name: PostgreSQL integration

on:
  pull_request:
    branches: [main, fix/middleware-public-route-matching]
  push:
    branches: [test/postgres-auth-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-and-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.mjs
      - run: pnpm run lint
      # Runner creates PostgreSQL, generates all test secrets, applies Prisma
      # migrations, builds, starts Next.js, tests over HTTP, then removes the DB.
      - run: pnpm test:integration
